# =============================================================================
# AURA Pipeline Service - Docker Compose for Local Development
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - ML_SERVICE_URL=http://ml-service:8000
      - LOG_LEVEL=debug
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aura-network

  # ---------------------------------------------------------------------------
  # ML Service (Python/FastAPI)
  # ---------------------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=aura
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aura_dev}
      - POSTGRES_DB=aura
      - LOG_LEVEL=info
      - MODEL_DIR=/app/models
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ml-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - aura-network

  # ---------------------------------------------------------------------------
  # PostgreSQL (user feedback & model artifacts)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev}
      POSTGRES_DB: aura
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ml-service/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aura-network

  # ---------------------------------------------------------------------------
  # Pipeline Runner (manual trigger)
  # ---------------------------------------------------------------------------
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/pipeline/orchestrator.js"]
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - PIPELINE_MODE=full
      - ML_SERVICE_URL=http://ml-service:8000
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - pipeline  # Only run with --profile pipeline
    networks:
      - aura-network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aura-network

  # ---------------------------------------------------------------------------
  # Redis Commander (optional UI for Redis)
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    profiles:
      - tools  # Only run with --profile tools
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  ml-models:
